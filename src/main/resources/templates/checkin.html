<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('入住登记', ~{::main})}">
<main>
    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span>在住记录</span>
            <button class="btn btn-primary btn-sm" onclick="openCheckinModal()">办理入住</button>
        </div>
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>入住单号</th>
                        <th>客户姓名</th>
                        <th>手机号</th>
                        <th>房间</th>
                        <th>入住时间</th>
                        <th>预计退房</th>
                        <th>押金</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="checkinTable"></tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="checkinModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">办理入住</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="checkinForm">
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">客户姓名</label>
                                <input type="text" class="form-control" id="customerName" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">手机号</label>
                                <input type="tel" class="form-control" id="customerPhone" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">身份证号</label>
                                <input type="text" class="form-control" id="idCard">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">分配房间</label>
                                <select class="form-select" id="roomId" required>
                                    <option value="">请选择房间</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">押金</label>
                                <input type="number" class="form-control" id="deposit" value="0" step="0.01">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">入住时间</label>
                                <input type="datetime-local" class="form-control" id="checkinTime">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">预计退房</label>
                                <input type="datetime-local" class="form-control" id="checkoutTime">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">备注</label>
                            <textarea class="form-control" id="remark" rows="2"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                    <button type="button" class="btn btn-primary" onclick="saveCheckin()">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let checkinModal;

        function loadCheckins() {
            ajaxGet('/api/checkin/list?status=0', function(data) {
                const $tbody = $('#checkinTable').empty();
                if (!data || data.length === 0) {
                    $tbody.append('<tr><td colspan="8" class="text-center text-muted">暂无在住记录</td></tr>');
                    return;
                }
                data.forEach(item => {
                    const html = `
                        <tr>
                            <td>${item.recordNo}</td>
                            <td>${item.customerName || ''}</td>
                            <td>${item.customerPhone || ''}</td>
                            <td>${item.roomNo || ''}</td>
                            <td>${formatDate(item.checkinTime)}</td>
                            <td>${formatDate(item.checkoutTime)}</td>
                            <td>¥${item.deposit || 0}</td>
                            <td>
                                <a href="/checkout" class="btn btn-sm btn-success">退房</a>
                            </td>
                        </tr>
                    `;
                    $tbody.append(html);
                });
            });
        }

        function loadFreeRooms() {
            ajaxGet('/api/room/list', function(rooms) {
                const $room = $('#roomId').empty().append('<option value="">请选择房间</option>');
                rooms.filter(r => r.status === 0 || r.status === 1).forEach(r => {
                    $room.append(`<option value="${r.id}">${r.roomNo} - ${r.typeName} ¥${r.price} (${roomStatusText(r.status)})</option>`);
                });
            });
        }

        function openCheckinModal() {
            $('#checkinForm')[0].reset();
            loadFreeRooms();
            const now = new Date();
            const tomorrow = new Date(now.getTime() + 24 * 60 * 60 * 1000);
            $('#checkinTime').val(now.toISOString().slice(0, 16));
            $('#checkoutTime').val(tomorrow.toISOString().slice(0, 16));
            checkinModal.show();
        }

        function saveCheckin() {
            const data = {
                customerName: $('#customerName').val(),
                customerPhone: $('#customerPhone').val(),
                idCard: $('#idCard').val(),
                roomId: $('#roomId').val(),
                deposit: $('#deposit').val() || 0,
                checkinTime: $('#checkinTime').val(),
                checkoutTime: $('#checkoutTime').val(),
                remark: $('#remark').val()
            };
            ajaxPost('/api/checkin/save', data, function() {
                checkinModal.hide();
                loadCheckins();
                alert('入住办理成功');
            });
        }

        $(function() {
            checkinModal = new bootstrap.Modal(document.getElementById('checkinModal'));
            loadCheckins();
        });
    </script>
</main>
</html>
