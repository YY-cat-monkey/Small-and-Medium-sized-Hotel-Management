<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('账单管理', ~{::main})}">
<main>
    <div class="card">
        <div class="card-header">账单列表</div>
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>账单号</th>
                        <th>入住单号</th>
                        <th>客户</th>
                        <th>房间</th>
                        <th>房费</th>
                        <th>消费</th>
                        <th>应收</th>
                        <th>实收</th>
                        <th>状态</th>
                    </tr>
                </thead>
                <tbody id="billTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        function loadBills() {
            ajaxGet('/api/bill/list', function(data) {
                const $tbody = $('#billTable').empty();
                if (!data || data.length === 0) {
                    $tbody.append('<tr><td colspan="9" class="text-center text-muted">暂无账单</td></tr>');
                    return;
                }
                data.forEach(item => {
                    const html = `
                        <tr>
                            <td>${item.billNo}</td>
                            <td>${item.recordNo || ''}</td>
                            <td>${item.customerName || ''}</td>
                            <td>${item.roomNo || ''}</td>
                            <td>¥${item.roomFee || 0}</td>
                            <td>¥${item.consumptionAmount || 0}</td>
                            <td>¥${item.totalAmount || 0}</td>
                            <td>¥${item.paidAmount || 0}</td>
                            <td><span class="status-badge ${item.status === 1 ? 'badge-free' : 'badge-booked'}">${billStatusText(item.status)}</span></td>
                        </tr>
                    `;
                    $tbody.append(html);
                });
            });
        }

        $(function() {
            loadBills();
        });
    </script>
</main>
</html>
