<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - 酒店管理系统'">酒店管理系统</title>
    <link href="/lib/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link href="/lib/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <script src="/lib/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="/lib/echarts/echarts.min.js"></script>
    <script src="/lib/jquery/jquery.min.js"></script>
    <link rel="stylesheet" href="/css/common.css">
    <script src="/js/common.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard"><i class="bi bi-building"></i> 酒店管理系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/dashboard"><i class="bi bi-speedometer2"></i> 首页</a></li>
                    <li class="nav-item"><a class="nav-link" href="/room"><i class="bi bi-door-open"></i> 客房管理</a></li>
                    <li class="nav-item"><a class="nav-link" href="/booking"><i class="bi bi-calendar-check"></i> 预订管理</a></li>
                    <li class="nav-item"><a class="nav-link" href="/checkin"><i class="bi bi-box-arrow-in-right"></i> 入住登记</a></li>
                    <li class="nav-item"><a class="nav-link" href="/checkout"><i class="bi bi-box-arrow-right"></i> 退房结算</a></li>
                    <li class="nav-item"><a class="nav-link" href="/bill"><i class="bi bi-receipt"></i> 账单管理</a></li>
                    <li class="nav-item"><a class="nav-link" href="/customer"><i class="bi bi-people"></i> 客户管理</a></li>
                    <li class="nav-item"><a class="nav-link" href="/user"><i class="bi bi-person-gear"></i> 系统用户</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/logout"><i class="bi bi-box-arrow-left"></i> 退出</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container-fluid py-4" th:insert="${content}"></main>
</body>
</html>
