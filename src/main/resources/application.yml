server:
  port: ${PORT:8080}
  servlet:
    context-path: /
    session:
      timeout: 2h
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: hotel-management-system

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 优先用完整 JDBC 地址 DB_URL；否则由 Railway MySQL 插件注入的 MYSQLHOST 等变量拼装
    url: ${DB_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:hotel_db}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:${MYSQLUSER:root}}
    password: ${DB_PASSWORD:${MYSQLPASSWORD:123456}}

  # 启动时自动建表 + 灌入种子数据（脚本幂等，可重复执行）
  sql:
    init:
      mode: always
      encoding: UTF-8
      continue-on-error: false

  thymeleaf:
    cache: true
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
    mode: HTML

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

  mvc:
    hiddenmethod:
      filter:
        enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:/mapper/**/*.xml

logging:
  level:
    root: info
    com.hotel: info
